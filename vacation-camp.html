<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MOVE — Ficha de inscripción</title>
<!--
  La ficha de inscripción ahora vive en inscripcion.html (un nombre
  general, para cursos con cualquier nombre). Esta página solo existe
  para que los links ya compartidos sigan funcionando: manda a
  inscripcion.html conservando lo que venga en el link. Sin nada abre
  la temporada 2026, y con ?c=código (links viejos) la de ese código.
  Sin JavaScript, el meta refresh (dentro de <noscript>, para que no
  compita con el script y pierda el ?...) manda a la ficha sin parámetros.
-->
<noscript><meta http-equiv="refresh" content="0; url=inscripcion.html" /></noscript>
<link rel="canonical" href="https://academiamovedance.com/inscripcion.html" />
<script>
  location.replace("inscripcion.html" + location.search + location.hash);
</script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px 16px;">
<p>La ficha de inscripción se cambió de dirección. Si no te lleva sola, <a href="inscripcion.html">toca aquí</a>.</p>
</body>
</html>
