<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MOVE — Pantalla en Vivo — Entradas</title>
<meta name="theme-color" content="#ef4b9b" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="recepcion.css" />
<link rel="stylesheet" href="entradas-mapa.css" />
<link rel="stylesheet" href="entradas-pantalla.css" />
</head>
<body>

<!-- ============ PANTALLA: CLAVE (tarjeta chica, como el resto de la app) ============ -->
<div class="container" id="pantallaLogin">
  <img src="logo.png" alt="MOVE Dance Academy" class="logo" />
  <div class="title">🎟️ Entradas — Pantalla en Vivo</div>
  <section class="pantalla">
    <p class="subtitulo">🔒 Escribe la clave del panel</p>
    <input type="password" id="inputClavePantalla" class="input-clave" placeholder="••••" autocomplete="off" />
    <button class="btn-grande btn-siguiente" id="btnEntrarPantalla">Entrar →</button>
    <p class="mensaje-error" id="mensajeErrorLogin"></p>
  </section>
</div>

<!-- ============ PANTALLA: TABLERO EN VIVO (ocupa toda la pantalla) ============ -->
<section id="pantallaTablero" class="tablero-vivo" hidden>

  <header class="tablero-header">
    <div class="tablero-header-marca">
      <img src="logo.png" alt="MOVE Dance Academy" class="tablero-logo" />
      <span class="tablero-titulo">Entradas — Show Fin de Año</span>
    </div>
    <p class="reloj-vivo" id="textoRelojVivo">—</p>
  </header>

  <div class="tablero-cuerpo">

    <aside class="tablero-lateral">
      <div class="tarjeta-turno-vivo" id="tarjetaTurnoVivo">
        <p class="etiqueta-turno-vivo">Turno en curso</p>
        <p class="numero-turno-vivo" id="textoNumeroTurnoVivo">—</p>
        <p class="nombre-turno-vivo" id="textoNombreTurnoVivo"></p>
        <p class="cronometro-turno-vivo" id="textoCronometroVivo"></p>
      </div>

      <div class="tarjeta-turno-vivo" id="tarjetaModoIndividualVivo" hidden>
        <p class="etiqueta-turno-vivo">Venta individual</p>
        <p class="texto-modo-individual-vivo">🟢 En curso — cualquiera puede comprar sus asientos, sin turno.</p>
      </div>

      <div class="grid-stats-vivo">
        <div class="stat-caja-vivo">
          <span class="stat-numero-vivo" id="statDisponiblesVivo">—</span>
          <span class="stat-etiqueta-vivo">Disponibles</span>
        </div>
        <div class="stat-caja-vivo">
          <span class="stat-numero-vivo" id="statReservadasVivo">—</span>
          <span class="stat-etiqueta-vivo">Reservadas</span>
        </div>
        <div class="stat-caja-vivo">
          <span class="stat-numero-vivo" id="statVendidasVivo">—</span>
          <span class="stat-etiqueta-vivo">Vendidas</span>
        </div>
      </div>

      <div class="leyenda-mapa leyenda-mapa-vivo">
        <span class="leyenda-item"><i class="punto punto-disponible"></i>Disponible</span>
        <span class="leyenda-item"><i class="punto punto-vendida"></i>Ocupada</span>
      </div>
    </aside>

    <div class="tablero-mapa-col">
      <div class="mapa-scroll" id="mapaScroll">
        <div class="mapa-teatro">
          <div class="escenario">ESCENARIO</div>
          <div class="mapa-secciones" id="mapaSecciones">
            <p class="lista-vacia">Cargando mapa de butacas...</p>
          </div>
        </div>
      </div>
    </div>

  </div>

</section>

<script src="entradas-pantalla.js"></script>
</body>
</html>
