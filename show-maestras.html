<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MOVE — Alumnas Show</title>
<meta name="theme-color" content="#ef4b9b" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
<!-- Base (login, botones, barra) de "Aviso a mis alumnas", para que se
     vea igual que el resto del Portal de Maestras. -->
<link rel="stylesheet" href="aviso.css" />
<link rel="stylesheet" href="show-vista.css?v=pagos-y-no-activas-v1" />
</head>
<body>

<div class="container">

  <img src="logo.png" alt="MOVE Dance Academy" class="logo" />
  <div class="title">🎭 Alumnas Show</div>

  <!-- ============ PANTALLA 0: CLAVE DE MAESTRA ============ -->
  <section id="pantallaLogin" class="pantalla">
    <p class="subtitulo">🔒 Escribe tu clave de maestra</p>
    <input type="password" id="inputClaveMaestra" class="input-clave" placeholder="••••" autocomplete="off" />
    <button class="btn-grande btn-siguiente" id="btnEntrarMaestra" type="button">Entrar →</button>
    <a class="btn-enlace" href="portal-maestras.html">¿Olvidaste tu clave? Recupérala en el Portal de Maestras</a>
    <p class="mensaje-error" id="mensajeErrorLogin"></p>
  </section>

  <!-- ============ PANTALLA 1: MIS GRUPOS → BAILES → ALUMNAS ============ -->
  <section id="pantallaShow" class="pantalla" hidden>
    <div class="barra-superior">
      <a class="btn-volver" href="portal-maestras.html">← Portal</a>
      <span class="barra-titulo">Tus grupos en el show</span>
    </div>
    <p class="pista-campo">Solo lectura. Si falta una alumna o un baile, avísale a Recepción.</p>
    <div id="listaShow"><p class="subtitulo">Cargando...</p></div>
    <p class="mensaje-error" id="mensajeErrorShow"></p>
  </section>

</div>

<script src="sesionmaestra.js"></script>
<script src="show-maestras.js?v=pagos-y-no-activas-v1"></script>
</body>
</html>
