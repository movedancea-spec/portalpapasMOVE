<head>

<title>Panel de Academia</title>
<!--
  El Biométrico (SaaS) ya NO vive en este sitio: su única versión está en
  el repo biometrico-clientes (https://movedancea-spec.github.io/biometrico-clientes/).
  Esta página solo existe para que los links viejos sigan funcionando: manda
  a la misma página allá, conservando lo que venga en el link (por ejemplo

  compita con el script y pierda el ?...) manda a la página sin parámetros.
-->

<link rel="canonical" href="https://movedancea-spec.github.io/biometrico-clientes/academia.html" />
<script>
  location.replace("https://movedancea-spec.github.io/biometrico-clientes/academia.html" + location.search + location.hash);
</script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px 16px;">
<p>Esta página se cambió de dirección. Si no te lleva sola, <a href="https://movedancea-spec.github.io/biometrico-clientes/academia.html">toca aquí</a>.</p>
</body>
</html>
