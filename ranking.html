<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MOVE — Ranking de Grupos</title>
<meta name="theme-color" content="#ef4b9b" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ranking.css" />
</head>
<body>

<div class="container">

  <img src="logo.png" alt="MOVE Dance Academy" class="logo" />
  <div class="title">🏆 Ranking de Grupos</div>

  <!-- ============ PANTALLA 0: CLAVE ============ -->
  <section id="pantallaLogin" class="pantalla">
    <p class="subtitulo">🔒 Escribe la clave</p>
    <input type="password" id="inputClaveRanking" class="input-clave" placeholder="••••" autocomplete="off" />
    <button class="btn-grande btn-siguiente" id="btnEntrarRanking">Entrar →</button>
    <p class="mensaje-error" id="mensajeErrorLogin"></p>

    <button class="btn-enlace" id="btnMostrarRecuperarRanking" type="button">¿Olvidaste la clave?</button>

    <div id="bloqueRecuperarRanking" hidden>
      <p class="aviso-familia">Se enviará la clave por WhatsApp al número registrado.</p>
      <button class="btn-secundario btn-ancho" id="btnEnviarRecuperarRanking" type="button">
        📲 Enviarla por WhatsApp
      </button>
      <p class="mensaje-recuperar" id="mensajeRecuperarRanking" hidden></p>
    </div>
  </section>

  <!-- ============ PANTALLA 1: RANKING ============ -->
  <section id="pantallaRanking" class="pantalla" hidden>
    <p class="subtitulo" id="subtituloMes">Calificación interna del mes en curso</p>
    <p class="aviso-familia">Esta pantalla es solo tuya — las maestras no ven este ranking.</p>

    <div id="listaRanking" class="lista-ranking">
      <p class="lista-vacia">Cargando...</p>
    </div>

    <button class="btn-secundario btn-ancho" id="btnActualizarRanking" type="button">🔄 Actualizar</button>
    <button class="btn-enlace" id="btnSalirRanking" type="button">Salir</button>
  </section>

</div>

<script src="ranking.js"></script>
</body>
</html>
