<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MOVE — Panel de Clase</title>
<meta name="theme-color" content="#ef4b9b" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="clase.css" />
</head>
<body>

<div class="container">

  <img src="logo.png" alt="MOVE Dance Academy" class="logo" />
  <div class="title">Panel de Clase</div>

  <!-- ============ PANTALLA 0: CLAVE DE MAESTRA ============ -->
  <section id="pantallaLogin" class="pantalla">
    <p class="subtitulo">🔒 Escribe tu clave de maestra</p>
    <input type="password" id="inputClaveMaestra" class="input-clave" placeholder="••••" autocomplete="off" />
    <button class="btn-grande btn-siguiente" id="btnEntrarMaestra">Entrar →</button>
    <p class="mensaje-error" id="mensajeErrorLogin"></p>
  </section>

  <!-- ============ PANTALLA 1: ELEGIR GRUPO ============ -->
  <section id="pantallaGrupos" class="pantalla" hidden>
    <p class="subtitulo">🩰 ¿Con qué grupo vas a dar clase?</p>
    <div id="listaGrupos" class="lista-grupos"></div>
    <p class="mensaje-error" id="mensajeErrorGrupos"></p>
  </section>

  <!-- ============ PANTALLA 2: PANEL DE CLASE ============ -->
  <section id="pantallaPanel" class="pantalla" hidden>
    <p class="nombre-grupo" id="nombreGrupoPanel"></p>

    <div class="tabs-panel">
      <button class="tab-btn activo" id="tabBienvenida" type="button">👋 Bienvenida</button>
      <button class="tab-btn" id="tabClase" type="button">🎬 Clase</button>
      <button class="tab-btn" id="tabCierre" type="button">🏆 Cierre</button>
    </div>

    <!-- ---- Modo Bienvenida ---- -->
    <div id="modoBienvenida" class="modo">
      <div class="contador-llegadas" id="contadorLlegadas">Cargando...</div>
      <div id="listaBienvenida" class="lista-bienvenida"></div>
      <button class="btn-secundario btn-ancho" id="btnRefrescarBienvenida" type="button">🔄 Actualizar</button>
    </div>

    <!-- ---- Modo Clase (cronómetro + puntos) ---- -->
    <div id="modoClase" class="modo" hidden>
      <div class="bloque-cronometro">
        <div class="cronometro-numero" id="cronometroNumero">00:30</div>
        <div class="cronometro-botones-preset">
          <button class="btn-preset" data-seg="30" type="button">30s</button>
          <button class="btn-preset" data-seg="60" type="button">1 min</button>
          <button class="btn-preset" data-seg="120" type="button">2 min</button>
          <button class="btn-preset" data-seg="180" type="button">3 min</button>
        </div>
        <div class="cronometro-botones-control">
          <button class="btn-secundario" id="btnIniciarCronometro" type="button">▶️ Iniciar</button>
          <button class="btn-secundario" id="btnPausarCronometro" type="button">⏸️ Pausar</button>
          <button class="btn-cancelar-cumple" id="btnReiniciarCronometro" type="button">↺ Reiniciar</button>
        </div>
      </div>

      <p class="pago-titulo">⭐ Puntos de la clase</p>
      <div id="listaPuntos" class="lista-puntos"></div>
      <button class="btn-cancelar-cumple btn-ancho" id="btnReiniciarPuntos" type="button">↺ Reiniciar puntos</button>
    </div>

    <!-- ---- Modo Cierre ---- -->
    <div id="modoCierre" class="modo" hidden>
      <p class="aviso-familia">Así quedó la clase de hoy — comparte esta pantalla con el grupo antes de despedirse. 🎉</p>
      <div id="listaCierre" class="lista-cierre"></div>
      <button class="btn-grande btn-siguiente" id="btnNuevaClase">🔁 Nueva clase (elegir otro grupo)</button>
    </div>

    <button class="btn-enlace" id="btnCerrarSesionPanel" type="button">Salir</button>
  </section>

</div>

<script src="clase.js"></script>
</body>
</html>
