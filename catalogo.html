<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>MOVE Dance Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:"Poppins",sans-serif;color:#444;
  background:linear-gradient(-45deg,#ffffff,#fff4fb,#ffe9f5,#fff6fc,#ffffff);
  background-size:400% 400%;animation:gradientMove 18s ease infinite;
}
body{position:fixed;inset:0;}
@keyframes gradientMove{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

.app{position:relative;z-index:2;width:100%;height:100%;}

/* ============ EXPLORAR (grilla) ============ */
#explorar{
  width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:36px 20px 90px;
}
.logo-wrap{position:relative;width:150px;max-width:55%;margin:0 auto 4px;}
.logo{position:relative;z-index:1;width:100%;display:block;filter:drop-shadow(0 12px 22px rgba(239,75,155,.25));}
.explorar-titulo{
  font-family:"Fredoka",sans-serif;text-align:center;font-size:clamp(22px,6.5vw,28px);
  font-weight:700;margin:14px 0 6px;color:#ef4b9b;
}
.explorar-sub{text-align:center;font-size:13.5px;font-weight:600;color:#8a6577;max-width:340px;margin:0 auto 22px;line-height:1.5;}

.buscador{max-width:400px;margin:0 auto 22px;display:flex;gap:8px;}
.buscador input{
  flex:1;border:2px solid #ffd8ea;border-radius:16px;padding:13px 15px;
  font-size:15px;font-weight:600;color:#555;background:rgba(255,255,255,.75);outline:none;
}
.buscador input::placeholder{color:#c497af;}
.buscador input:focus{border-color:#ef4b9b;box-shadow:0 0 0 3px rgba(239,75,155,.15);}
.buscador button{
  border:none;border-radius:16px;padding:0 18px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#ff72b7,#ef4b9b);box-shadow:0 8px 18px rgba(239,75,155,.3);
}
.buscador button:active{transform:scale(.95);}
.buscador-msg{max-width:400px;margin:-10px auto 16px;font-size:12.5px;font-weight:700;color:#e0245e;text-align:center;min-height:14px;}

.grid-cat{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile-cat{
  position:relative;border:2px solid #ffe3f0;border-radius:20px;
  background:rgba(255,255,255,.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 10px 22px rgba(239,75,155,.10);
  padding:22px 14px;text-align:center;cursor:pointer;transition:.15s;
  animation:tileIn .5s ease both;
  display:flex;align-items:center;justify-content:center;min-height:64px;
}
.tile-cat:active{transform:scale(.95);background:rgba(255,255,255,.9);}
.tile-cat .label{font-size:14px;font-weight:700;color:#a15277;line-height:1.3;}
@keyframes tileIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.footer-explorar{text-align:center;margin-top:26px;font-size:12px;font-weight:600;color:#999;}

/* ============ HISTORIA (story mode) ============ */
#historia{
  position:fixed;inset:0;z-index:10;display:none;flex-direction:column;
  background:linear-gradient(-45deg,#ffffff,#fff4fb,#ffe9f5,#fff6fc,#ffffff);
  background-size:400% 400%;animation:gradientMove 18s ease infinite;
}
#historia.activa{display:flex;}

.barra-progreso{display:flex;gap:5px;padding:12px 12px 0;}
.segmento{flex:1;height:4px;border-radius:3px;background:rgba(239,75,155,.15);overflow:hidden;}
.segmento .relleno{height:100%;width:0%;background:#ef4b9b;border-radius:3px;transition:width .25s ease;}
.segmento.completo .relleno{width:100%;}

.historia-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;}
.historia-top .marca{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;color:#a15277;}
.historia-top .marca img{width:20px;filter:drop-shadow(0 2px 4px rgba(239,75,155,.3));}
.btn-cerrar{background:rgba(239,75,155,.12);border:none;color:#ef4b9b;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;}
.btn-cerrar:active{transform:scale(.9);}

.zonas-tap{position:absolute;inset:0;top:60px;display:flex;z-index:1;}
.zona-tap{flex:1;height:100%;}

.slide-cont{
  flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 16px 26px;overflow:hidden;
}
.slide{
  position:relative;z-index:2;width:100%;max-width:420px;text-align:center;pointer-events:none;
}
.slide-cat{font-family:"Fredoka",sans-serif;font-size:clamp(13px,4vw,15px);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#ef4b9b;margin-bottom:8px;animation:fadeUp .4s ease both;}
.slide-titulo{font-family:"Fredoka",sans-serif;font-size:clamp(26px,8vw,34px);font-weight:700;line-height:1.1;margin-bottom:10px;color:#333;animation:letraIn .55s cubic-bezier(.2,1.4,.4,1) both;}
.slide-sub{font-size:14.5px;font-weight:600;color:#8a6577;max-width:300px;margin:0 auto;animation:fadeUp .5s .1s ease both;}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes letraIn{from{opacity:0;transform:translateY(20px) scale(.9);}to{opacity:1;transform:translateY(0) scale(1);}}

.clase-nombre{font-family:"Fredoka",sans-serif;font-size:clamp(22px,7vw,28px);font-weight:700;margin-bottom:16px;color:#333;animation:letraIn .5s cubic-bezier(.2,1.4,.4,1) both;}

.horario-lista{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.horario-item{
  background:rgba(255,255,255,.75);border:1.5px solid #ffd8ea;border-radius:14px;
  padding:11px 14px;font-size:14px;font-weight:700;color:#555;
  animation:fadeUp .45s ease both;opacity:0;
}

.precio-caja{margin-bottom:16px;}
.precio-linea{
  display:flex;align-items:baseline;justify-content:center;gap:10px;margin-bottom:10px;
  animation:fadeUp .5s ease both;opacity:0;
}
.precio-linea .etiqueta{font-size:11.5px;font-weight:700;color:#a15277;text-transform:uppercase;letter-spacing:.6px;}
.precio-linea .monto{
  font-family:"Fredoka",sans-serif;font-size:clamp(24px,7.5vw,32px);font-weight:700;
  background:linear-gradient(90deg,#ff72b7,#ef4b9b);-webkit-background-clip:text;background-clip:text;color:transparent;
}

.confetti-wrap{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden;}
.confetti-pieza{position:absolute;width:10px;height:10px;border-radius:50%;top:44%;left:50%;opacity:0;}

.cta-wrap{position:relative;z-index:2;pointer-events:auto;display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:6px;width:fit-content;max-width:100%;}
.btn-whatsapp-slide{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:linear-gradient(180deg,#3ddc73,#22b757);color:#06210f;font-weight:800;font-size:14.5px;white-space:nowrap;
  padding:13px 20px;border-radius:999px;box-shadow:0 10px 26px rgba(40,200,110,.4);
  animation:fadeUp .5s .2s ease both,fabPulse 2.4s ease infinite;
}
.btn-whatsapp-slide:active{transform:scale(.95);}
@keyframes fabPulse{0%,100%{box-shadow:0 10px 26px rgba(40,200,110,.4);}50%{box-shadow:0 10px 32px rgba(40,200,110,.65);}}

.btn-reservar{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap;
  background:rgba(255,255,255,.85);color:#ef4b9b;font-weight:800;font-size:14.5px;
  border:2px solid #ef4b9b;padding:11px 20px;border-radius:999px;
  animation:fadeUp .5s .28s ease both;
}
.btn-reservar:active{transform:scale(.95);}

.hint-tap{
  position:absolute;bottom:20px;left:0;right:0;text-align:center;z-index:2;
  font-size:clamp(14px,4.5vw,17px);font-weight:800;cursor:pointer;
  color:#ef4b9b;animation:hintPulso 1.8s ease infinite;pointer-events:auto;
}
@keyframes hintPulso{0%,100%{opacity:.4;}50%{opacity:1;}}
</style>
</head>

function obtenerAudioCtx() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  } catch (e) {
    return null;
  }
}

function reproducirNotas(notas, duracionNota, volumen) {
  const ctx = obtenerAudioCtx();
  if (!ctx) return;
  notas.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    const inicio = ctx.currentTime + i * duracionNota * 0.85;
    gain.gain.setValueAtTime(0, inicio);
    gain.gain.linearRampToValueAtTime(volumen, inicio + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, inicio + duracionNota);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(inicio);
    osc.stop(inicio + duracionNota + 0.03);
  });
}

function sonarToque() {
  reproducirNotas([720], 0.08, 0.07);
}

function sonarRevelar() {
  reproducirNotas([523.25, 659.25, 783.99], 0.13, 0.08);
}

/* ---------- explorar: grilla ---------- */
function renderGrid() {
  const cont = el("gridCat");
  cont.innerHTML = "";
  GRUPOS.forEach((g, i) => {
    const tile = document.createElement("div");
    tile.className = "tile-cat";
    tile.style.animationDelay = (i * 0.05) + "s";
    tile.innerHTML = `<span class="label">${g.chip}</span>`;
    tile.addEventListener("click", () => { sonarToque(); iniciarHistoria(g.id); });
    cont.appendChild(tile);
  });
}

el("btnBuscarEdad").addEventListener("click", buscarPorEdad);
el("inputEdad").addEventListener("keydown", (e) => { if (e.key === "Enter") buscarPorEdad(); });

function buscarPorEdad() {
  sonarToque();
  const msg = el("buscadorMsg");
  const valor = Number(el("inputEdad").value);
  if (!valor || valor < 1) { msg.textContent = "Escribe una edad válida."; return; }
  const rango = RANGOS_EDAD.find((r) => valor >= r.min && valor <= r.max);
  if (!rango) {
    msg.textContent = valor > 35
      ? "Para esa edad tenemos clases de adultos — revisa Latino, Ballet o Coreografía."
      : "No encontramos una categoría exacta — escríbenos por WhatsApp y te ayudamos.";
    return;
  }
  msg.textContent = "";
  iniciarHistoria(rango.id);
}

/* ---------- historia (story mode) ---------- */
let slidesActuales = [];
let indiceSlide = 0;

function construirSlides(grupo) {
  const slides = [{ tipo: "intro", grupo }];
  grupo.clases.forEach((c) => slides.push({ tipo: "clase", grupo, clase: c }));
  slides.push({ tipo: "final", grupo });
  return slides;
}

let modoBloqueado = false;

function iniciarHistoria(idGrupo, bloqueado) {
  const grupo = GRUPOS.find((g) => g.id === idGrupo);
  if (!grupo) return;
  modoBloqueado = !!bloqueado;
  slidesActuales = construirSlides(grupo);
  indiceSlide = 0;
  el("historia").classList.add("activa");
  el("btnCerrarHistoria").style.display = modoBloqueado ? "none" : "";
  renderBarraProgreso();
  renderSlideActual();
}

function cerrarHistoria() {
  if (modoBloqueado) return;
  el("historia").classList.remove("activa");
  const params = new URLSearchParams(window.location.search);
  if (params.get("edad") || params.get("grupo")) {
    const url = window.location.origin + window.location.pathname;
    window.history.replaceState({}, "", url);
  }
}

el("btnCerrarHistoria").addEventListener("click", () => { sonarToque(); cerrarHistoria(); });
el("zonaAtras").addEventListener("click", () => { sonarToque(); avanzarSlide(-1); });
el("zonaAdelante").addEventListener("click", () => { sonarToque(); avanzarSlide(1); });
document.addEventListener("keydown", (e) => {
  if (!el("historia").classList.contains("activa")) return;
  if (e.key === "ArrowRight") avanzarSlide(1);
  if (e.key === "ArrowLeft") avanzarSlide(-1);
  if (e.key === "Escape") cerrarHistoria();
});

function avanzarSlide(dir) {
  const nuevo = indiceSlide + dir;
  if (nuevo < 0) return;
  if (nuevo >= slidesActuales.length) return;
  indiceSlide = nuevo;
  renderBarraProgreso();
  renderSlideActual();
}

function renderBarraProgreso() {
  const cont = el("barraProgreso");
  cont.innerHTML = "";
  slidesActuales.forEach((_, i) => {
    const seg = document.createElement("div");
    seg.className = "segmento" + (i < indiceSlide ? " completo" : "");
    const relleno = document.createElement("div");
    relleno.className = "relleno";
    if (i === indiceSlide) relleno.style.width = "100%";
    seg.appendChild(relleno);
    cont.appendChild(seg);
  });
}

function formatearMontoNumero(texto) {
  const limpio = (texto || "").replace(/[^\d]/g, "");
  return limpio ? Number(limpio) : null;
}

function animarConteo(elemento, destino, prefijo) {
  const duracion = 700;
  const inicio = performance.now();
  function paso(ahora) {
    const progreso = Math.min(1, (ahora - inicio) / duracion);
    const facilitado = 1 - Math.pow(1 - progreso, 3);
    const valorActual = Math.round(destino * facilitado);
    elemento.textContent = prefijo + valorActual.toLocaleString("es-GT");
    if (progreso < 1) requestAnimationFrame(paso);
  }
  requestAnimationFrame(paso);
}

function lanzarConfeti(contenedor) {
  const colores = ["#ef4b9b", "#ff9ec7", "#ffd8ea", "#f4c430"];
  for (let i = 0; i < 16; i++) {
    const pieza = document.createElement("span");
    pieza.className = "confetti-pieza";
    pieza.style.background = colores[Math.floor(Math.random() * colores.length)];
    const angulo = Math.random() * Math.PI * 2;
    const distancia = 70 + Math.random() * 90;
    const dx = Math.cos(angulo) * distancia;
    const dy = Math.sin(angulo) * distancia - 30;
    const rot = (Math.random() * 360 - 180).toFixed(0);
    pieza.style.transition = "transform .9s cubic-bezier(.2,.8,.3,1), opacity .9s ease";
    contenedor.appendChild(pieza);
    requestAnimationFrame(() => {
      pieza.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
      pieza.style.opacity = "1";
      setTimeout(() => { pieza.style.opacity = "0"; }, 500);
    });
    setTimeout(() => pieza.remove(), 1000);
  }
}

function renderSlideActual() {
  const cont = el("slideCont");
  const zonas = cont.querySelector(".zonas-tap");
  cont.innerHTML = "";
  cont.appendChild(zonas);

  const data = slidesActuales[indiceSlide];
  const slide = document.createElement("div");
  slide.className = "slide" + (data.tipo === "final" ? " slide-final" : "");

  if (data.tipo === "intro") {
    slide.innerHTML = `
      <p class="slide-cat">MOVE Dance Academy</p>
      <h2 class="slide-titulo">${data.grupo.titulo}</h2>
      ${data.grupo.subtitulo ? `<p class="slide-sub">${data.grupo.subtitulo}</p>` : ""}
    `;
    cont.appendChild(slide);

    const ctaWrapIntro = document.createElement("div");
    ctaWrapIntro.className = "cta-wrap";
    ctaWrapIntro.appendChild(crearBotonReservar());
    cont.appendChild(ctaWrapIntro);
  }

  if (data.tipo === "clase") {
    const c = data.clase;
    const horariosHtml = c.horarios.map((h, i) => `<div class="horario-item" style="animation-delay:${0.15 + i * 0.08}s">${h}</div>`).join("");
    const preciosHtml = c.precios.map((p, i) => `
      <div class="precio-linea" style="animation-delay:${0.3 + i * 0.1}s">
        <span class="etiqueta">${p.label}</span>
        <span class="monto" data-monto="${p.valor}">${p.valor}</span>
      </div>
    `).join("") + (c.inscripcion ? `
      <div class="precio-linea" style="animation-delay:${0.3 + c.precios.length * 0.1}s">
        <span class="etiqueta">Inscripción</span>
        <span class="monto">${c.inscripcion}</span>
      </div>` : "");

    slide.innerHTML = `
      <p class="slide-cat">${data.grupo.titulo}${data.grupo.subtitulo ? " · " + data.grupo.subtitulo : ""}</p>
      <h2 class="clase-nombre">${c.nombre}</h2>
      <div class="horario-lista">${horariosHtml}</div>
      <div class="precio-caja">${preciosHtml}</div>
    `;
    cont.appendChild(slide);

    const confettiWrap = document.createElement("div");
    confettiWrap.className = "confetti-wrap";
    cont.appendChild(confettiWrap);

    const ctaWrap = document.createElement("div");
    ctaWrap.className = "cta-wrap";
    const horarioTexto = c.horarios.join(" / ");
    const btn = document.createElement("a");
    btn.className = "btn-whatsapp-slide";
    btn.target = "_blank";
    btn.rel = "noopener";
    btn.href = mensajeWhatsapp(`Hola! Me interesa la clase de ${c.nombre} (${horarioTexto}) — ${data.grupo.titulo}${data.grupo.subtitulo ? ", " + data.grupo.subtitulo : ""}. ¿Me pueden dar más información? 😊`);
    btn.innerHTML = ICONO_WHATSAPP + "<span>Preguntar por esta clase</span>";
    btn.addEventListener("click", (e) => { e.stopPropagation(); sonarToque(); });
    ctaWrap.appendChild(btn);
    ctaWrap.appendChild(crearBotonReservar());
    cont.appendChild(ctaWrap);

    setTimeout(() => {
      slide.querySelectorAll(".monto[data-monto]").forEach((m) => {
        const num = formatearMontoNumero(m.dataset.monto);
        if (num) animarConteo(m, num, "Q");
      });
      lanzarConfeti(confettiWrap);
      sonarRevelar();
    }, 320);
  }

  if (data.tipo === "final") {
    slide.innerHTML = `<h2 class="slide-titulo">¡Te esperamos!</h2><p class="slide-sub">Escríbenos y te apartamos tu cupo, o resolvemos cualquier duda.</p>`;
    cont.appendChild(slide);

    const ctaWrap = document.createElement("div");
    ctaWrap.className = "cta-wrap";
    const btn = document.createElement("a");
    btn.className = "btn-whatsapp-slide";
    btn.target = "_blank";
    btn.rel = "noopener";
    btn.href = mensajeWhatsapp(`Hola! Vi la información de ${data.grupo.titulo}${data.grupo.subtitulo ? " (" + data.grupo.subtitulo + ")" : ""} y quiero inscribirme / tengo dudas 😊`);
    btn.innerHTML = ICONO_WHATSAPP + "<span>Escríbenos por WhatsApp</span>";
    btn.addEventListener("click", (e) => { e.stopPropagation(); sonarToque(); });
    ctaWrap.appendChild(btn);
    ctaWrap.appendChild(crearBotonReservar());

    if (data.grupo.notaGeneral) {
      const nota = document.createElement("p");
      nota.className = "slide-sub";
      nota.style.fontSize = "12px";
      nota.style.marginTop = "4px";
      nota.textContent = data.grupo.notaGeneral;
      ctaWrap.appendChild(nota);
    }

    cont.appendChild(ctaWrap);
  }

  const hint = document.createElement("p");
  hint.className = "hint-tap";
  hint.textContent = "toca para ver →";
  hint.addEventListener("click", (e) => {
    e.stopPropagation();
    sonarToque();
    avanzarSlide(1);
  });
  cont.appendChild(hint);
}

/* ---------- arranque ---------- */
renderGrid();

const params = new URLSearchParams(window.location.search);
const idDirecto = (params.get("edad") || params.get("grupo") || "").trim();
if (idDirecto && GRUPOS.find((g) => g.id === idDirecto)) {
  iniciarHistoria(idDirecto, true);
}
</script>
